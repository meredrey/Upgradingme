  quote:'Jestem mamą, do której zawsze można przyjść.',
  areas:[['Bezpieczeństwo emocjonalne','Córki wiedzą, że mogą ze mną rozmawiać o wszystkim: o marzeniach, lękach, błędach i trudnościach, bez obawy, że stracą moją miłość.'],['Obecność','Regularnie spędzamy razem czas, który daje nam radość i buduje wspomnienia. Jestem obecna, ciekawa ich świata i mam dla nich czas.'],['Moje zachowanie','Wyrażam granice z miłością i szacunkiem, nie używam pasywnej agresji i pracuję nad tym, by nie przenosić na córki własnych lęków.'],['Naprawianie relacji','Kiedy reaguję niewłaściwie, potrafię się do tego przyznać, przeprosić i wrócić do rozmowy.'],['Ich samodzielność','Wspieram je w budowaniu poczucia własnej wartości, empatii, umiejętności stawiania granic i podejmowania własnych decyzji.']],
  yearTitles:{1:'Fundamenty w codzienności',2:'Świadoma praca nad sobą',3:'Emocjonalne bezpieczeństwo',5:'Bliskość dostosowana do ich rozwoju',7:'Zaufanie i samodzielność',10:'Cel końcowy'},
  yearQuotes:{1:'Obecność dzisiaj tworzy naszą przyszłą więź.',2:'Im lepiej rozumiem siebie, tym spokojniej jestem obok nich.',3:'Tworzę przestrzeń, w której mogą być sobą.',5:'Nasza więź rośnie razem z ich niezależnością.',7:'Daję im skrzydła, ale zawsze jestem blisko.',10:'Jestem dumna z więzi, którą zbudowałyśmy.'},
  visionList:[],principles:[]},
 g2:{n:2,name:'Ja i moje zasoby',sub:'Ciało, finanse, spokój',c:'#8FA88A',l:'#EDF2EA',d:'#5F7A5A',icon:'lotus',
  statement:'Mam zasoby, by świadomie wybierać swoje życie.',
  vision:'Jestem silna, sprawna i pełna energii. Mam stabilność finansową i przestrzeń mentalną. Działam intencjonalnie, zamiast żyć na autopilocie lub sabotować siebie.',
  quote:'Czuję się dobrze, robię to, co ma dla mnie znaczenie.',
  areas:[['Ciało i energia','Jestem silna, sprawna i pełna energii. Mam zdrową kompozycję ciała, buduję i chronię mięśnie oraz dbam o kondycję na kolejne dekady.'],['Finanse','Mam stabilność finansową i swobodę podejmowania decyzji. Wydaję pieniądze świadomie, a nie pod wpływem chwili. Pieniądze wspierają moje życie i dają mi niezależność.'],['Regulacja emocji i wolność od kompulsji','Potrafię odczuwać napięcie, stres i trudne emocje bez automatycznego sięgania po alkohol, zakupy, jedzenie lub nadmierną produktywność. Umiem zatrzymać się, wybrać reakcję i wrócić do swoich priorytetów.']],
  yearTitles:{1:'Punkt wyjścia',2:'Stabilność i konsekwencja',3:'Oszczędzanie i inwestycje',5:'Większa swoboda wyboru',7:'Niezależność finansowa',10:'Bezpieczeństwo i opcje na przyszłość'},
  yearQuotes:{1:'Silne ciało to wolność.',2:'Finansowa swoboda daje mi więcej życia.',3:'Mam zasoby, by żyć życiem, które ma dla mnie znaczenie.',5:'Silne ciało to wolność.',7:'Finansowa swoboda daje mi więcej życia.',10:'Mam zasoby, by żyć życiem, które ma dla mnie znaczenie.'},
  visionList:[],
  principles:['Pauza: zatrzymuję się, zanim podejmę działanie.','Nazywam: „Czuję napięcie. Mam impuls…”','Pozostaję: 2–10 minut obserwuję odczucia.','Wybieram: decyduję świadomie, zamiast automatycznie.'],
  rules:{
   'Alkohol':['Nigdy więcej niż 3 drinki w jednym dniu.','Nigdy więcej niż 3 dni z alkoholem w tygodniu.','Nie używam alkoholu jako sposobu na zmniejszenie napięcia.','Mój cel: maksymalnie 1 raz w tygodniu; w dzień roboczy maks. 1 kieliszek; w weekend maks. 2 porcje.','Wyjątki na wakacjach są ok, ale nie przekraczam zasad „nigdy”.'],
   'Zakupy':['Zakup nieplanowany = minimum 24 godziny pauzy.','Zakup droższy lub silnie impulsywny = 72 godziny.','W czasie pauzy nie dodaję kolejnych rzeczy do koszyka.','Pytam: Czy tego nadal chcę? Czy mieści się w budżecie? Czy kupiłabym to, będąc spokojna?'],
   'Jedzenie':['Zatrzymuję się na 2–5 minut, zanim zjem.','Nazywam to, co czuję (stres, złość, nuda, zmęczenie, samotność).','Sprawdzam, czy jestem głodna fizycznie czy szukam ulgi emocjonalnej.','Jedzenie jest częścią życia: nie zakazuję, ale dbam o świadomy wybór i brak automatycznego jedzenia bez kontroli.']
  }},
 g3:{n:3,name:'Twórczość i rozwój',sub:'Pomysły w rzeczywistość',c:'#C9A66B',l:'#F8F0E1',d:'#8E7240',icon:'bulb',
  statement:'Tworzę, eksperymentuję i zamieniam pomysły w rzeczywistość.',
  vision:'Daję sobie przestrzeń na kreatywność, naukę i realizację projektów, które dają mi radość, rozwijają mnie i mogą przynosić wartość innym. Muzyka jest stałą częścią mojego życia.',
  quote:'Małe kroki tworzą wielkie rzeczy.',
  areas:[],
  yearTitles:{1:'Rytm twórczy',2:'Pierwszy projekt',3:'Kolejny projekt',5:'Kilka ukończonych projektów',7:'Pomysły w rezultaty',10:'Tworzę i eksperymentuję'},
  yearQuotes:{1:'Małe kroki tworzą wielkie rzeczy.',2:'Eksperymenty też się liczą.',3:'Robię postęp, nie muszę być od razu idealnie.',5:'Wybieram projekty, które mnie naprawdę ciekawią.',7:'Cieszę się procesem i uczę się po drodze.',10:'Tworzę, bo to mnie rozwija i daje mi radość.'},
  visionList:['Mam na koncie kilka ukończonych projektów, produktów lub publikacji.','Muzyka jest ważną częścią mojego życia.','Regularnie uczę się nowych rzeczy.','Cieszę się procesem tworzenia, niezależnie od skali sukcesu.','Tworzę, bo to mnie rozwija i daje mi radość.'],
  principles:['Robię postęp, nie muszę być od razu idealnie.','Eksperymenty też się liczą.','Wybieram projekty, które mnie naprawdę ciekawią.','Pozwalam projektom dojrzewać, nie wszystko musi być gotowe w rok.','Cieszę się procesem i uczę się po drodze.'],
  counts:['Działający prototyp / wersja beta','Opublikowana strona lub aplikacja','Ukończony manuskrypt lub publikacja','Pierwsi klienci dla usługi','Ukończony kurs lub nagrania','Własny utwór (opublikowany lub nagrany)']},
 g4:{n:4,name:'Przygoda',sub:'Ciekawość i odwaga',c:'#7E9FB5',l:'#E8F0F5',d:'#557489',icon:'mountain',
  statement:'Żyję z ciekawością i odwagą.',
  vision:'Podróżuję, odkrywam, uczę się i próbuję nowych rzeczy. Poszerzam swoje horyzonty małymi krokami, nie czekając na idealny moment. Mam doświadczenia, które są tylko moje, i tworzę wspomnienia z ludźmi, których kocham.',
  quote:'Świat jest pełen rzeczy, które chcę poznać i nie muszę się spieszyć, żeby ich doświadczać.',
  areas:[['Podróże i poznawanie świata','1–2 większe podróże rocznie; odkrywanie nowych krajów, kultur i smaków; również krótkie wyjazdy w Polsce i blisko domu; podróże z rodziną i solo.'],['Nauka nowych umiejętności','Nowe przepisy i kuchnie; kursy (np. języki, muzyka, fotografia, ceramika); zrozumienie, jak coś działa; ciekawość i otwartość na nową wiedzę.'],['Lekkie przekraczanie granic','Robienie rzeczy, które mnie onieśmielają; samodzielne wyjścia; inicjowanie kontaktów; mówienie „tak” nowym możliwościom.'],['Kultura, muzyka i sztuka','Koncerty, teatr, wystawy; festiwale i lokalne wydarzenia; odkrywanie nowych artystów i gatunków; regularny kontakt ze sztuką.'],['Czas tylko dla siebie','Samodzielne podróże i wyjazdy; weekendowe wypady; czas na swoje pasje i refleksję; cieszenie się własnym towarzystwem.'],['Rodzina i wspólne wspomnienia','Podróże i przygody z córkami; odkrywanie świata razem; pokazywanie dzieciom nowych miejsc i kultur; tworzenie rodzinnych rytuałów i tradycji.'],['Nowi ludzie i nowe środowiska','Poznawanie inspirujących ludzi; udział w nowych społecznościach (online i offline); utrzymywanie kontaktu z dawnymi znajomymi; otwartość na różnorodne perspektywy.']],
  yearTitles:{1:'Start przygody',2:'Odwaga i samodzielność',3:'Swobodniej i częściej',5:'Nowe hobby i ludzie',7:'Śmiałe wyzwania',10:'Życie pełne ciekawości'},
  yearQuotes:{1:'Małe kroki też się liczą.',2:'Nie muszę czekać na idealny moment.',3:'Ciekawość zamiast oceniania.',5:'Tworzę wspomnienia, nie tylko plany.',7:'Łączę przygodę z odpoczynkiem.',10:'Więcej przygód, więcej mnie.'},
  visionList:['Poznaję świat i wracam z niego bogatsza.','Regularnie uczę się nowych rzeczy.','Robię rzeczy, które trochę mnie onieśmielają.','Kultura, muzyka i sztuka są częścią mojego życia.','Spędzam wartościowy czas sama ze sobą.','Tworzę niezapomniane wspomnienia z rodziną i bliskimi.','Poznaję nowych ludzi i inspirujące środowiska.','Cieszę się codzienną ciekawością życia.'],
  principles:['Ciekawość zamiast oceniania.','Małe kroki też się liczą.','Nie muszę czekać na idealny moment.','Wybieram to, co naprawdę mnie interesuje.','Łączę przygodę z odpoczynkiem.','Tworzę wspomnienia, nie tylko plany.','Powracam do rzeczy, które dają mi radość.'],
  expTargets:{1:12,2:24,3:36,5:60,7:84,10:120}},
 g5:{n:5,name:'Relacje',sub:'Ludzie, z którymi dobrze mi się żyje',c:'#A07A9A',l:'#F2E9F0',d:'#77566F',icon:'people',
  statement:'Otaczam się ludźmi, z którymi dobrze mi się żyje.',
  vision:'Mam bliskie, ciepłe i wzajemne relacje. Potrafię mówić o swoich potrzebach, stawiać granice i rozmawiać o trudnych sprawach bez uciekania ani atakowania. Dbam o innych, ale nie porzucam siebie. Potrafię naprawiać relacje, a także rozpoznawać, kiedy warto odpuścić.',
  quote:'Ja jestem OK i inni są OK. Moje potrzeby są ważne, tak samo jak potrzeby innych, z lekkim pierwszeństwem dla siebie.',
  areas:[['Małżeństwo i bliskość','Codziennie 15 minut rozmowy (wyłączamy telefony). Lista tematów od łatwych do trudniejszych. Najpierw budujemy zaufanie, potem pogłębiamy intymność emocjonalną. Namiętność i zaangażowanie są na dobrym poziomie.'],['Przyjaźnie i własny krąg ludzi','Raz w tygodniu kontakt z Marysią, Kasią i Natalią. Raz w tygodniu kontakt z Justyną lub braćmi. Raz na 2 miesiące kontakt z kimś innym. Inicjuję spotkania i cieszę się czasem z ważnymi dla mnie ludźmi.'],['Granice i asertywność','Mówię o swoich potrzebach. Potrafię powiedzieć „nie” bez poczucia winy. Nie zgadzam się bez agresji ani nadmiernego tłumaczenia się. Zwracam uwagę, jak różni ludzie na mnie wpływają.'],['Konflikty i naprawianie relacji','Traktuję konflikty jako część relacji, a nie zagrożenie. Potrafię spokojnie wracać do trudnych tematów. Słucham i staram się rozumieć drugą stronę. Umiem przyznać się do błędu, przeprosić i znaleźć rozwiązanie.'],['Wzajemność i dobre wybory','Inwestuję w relacje, które są wzajemne. Świadomie wybieram, komu daję swój czas. Regularnie sprawdzam, jak czuję się przy danych osobach. Ograniczam relacje, które mnie wyczerpują lub mi nie służą.']],
  yearTitles:{1:'Buduję fundamenty',2:'Więcej bezpieczeństwa',3:'Głębsze zrozumienie',5:'Stabilność i bliskość',7:'Większa swoboda',10:'Ludzie, którzy dają mi radość'},
  yearQuotes:{1:'Buduję fundamenty.',2:'Więcej bezpieczeństwa.',3:'Głębsze zrozumienie.',5:'Stabilność i bliskość.',7:'Większa swoboda.',10:'Ludzie, którzy dają mi radość.'},
  visionList:['Mam bliską i stabilną relację z mężem, opartą na zaufaniu, szczerości i czułości.','Mam kilka prawdziwych przyjaźni, które dają mi wsparcie, radość i inspirację.','Umiem stawiać granice i mówić o swoich potrzebach.','Potrafię rozwiązywać konflikty i naprawiać relacje.','Świadomie wybieram ludzi, z którymi chcę spędzać czas i które relacje mi służą.','Dbam o innych, ale nie tracę siebie.'],
  principles:['Stawiam siebie i innych na równi (z lekką przewagą na siebie).','Mówię o swoich potrzebach, zamiast oczekiwać, że inni je odgadną.','Wybieram jakość, nie ilość.','Konflikty są częścią relacji i można na nich budować.','Otaczam się ludźmi, przy których czuję się dobrze.','Ja jestem OK i inni są OK.'],
  reflQ:['Jak czuję się w swoich ważnych relacjach?','Czy mogę być sobą?','Czy kontakt jest wzajemny?','Czy czuję się dobrze, neutralnie, czy wyczerpana?','Czy podtrzymuję tę relację, bo naprawdę chcę?']}
};
const GIDS=['g1','g2','g3','g4','g5'];
const G0=Object.keys(G);

const MS={
 g1:{1:['Czas 17:00–19:00 bez telefonu, z pełną uwagą na córki (pon–pt).','Każdy weekend min. jedna wspólna aktywność rodzinna.','Co tydzień indywidualny czas z Emmą i z Anią (min. 20–30 minut).','Zaczynam tworzyć listę sytuacji i wzorców do pracy na terapii.','Po konfliktach wracam do rozmowy i naprawiam relację.'],
  2:['Wracam na terapię i regularnie w niej uczestniczę.','Mam jasno określone cele terapeutyczne.','Utrzymuję codzienny czas 17:00–19:00 bez telefonu.','Kontynuuję weekendowe aktywności i indywidualny czas z córkami.','Pracuję nad regulacją emocji, granicami i ograniczeniem pasywnej agresji.'],
  3:['Regularnie rozmawiamy o emocjach, potrzebach i trudnościach.','Ćwiczę słuchanie bez oceniania.','Daję im przestrzeń na samodzielność i własne rozwiązania.','Utrzymuję nasze rytuały z pierwszych lat.','Uczę je, że błędy są częścią życia i można o nich rozmawiać.'],
  5:['Dostosowuję sposób spędzania czasu do ich zainteresowań.','Szanuję ich prywatność i autonomię.','Nasza relacja nie opiera się tylko na logistyce i obowiązkach.','Regularnie tworzymy wspólne doświadczenia i wspomnienia.','Potrafię przyjąć ich niezgodę i odmienne zdanie, bez poczucia odrzucenia.'],
  7:['Rozmawiamy o trudnych decyzjach, relacjach, granicach i odpowiedzialności.','Wspieram ich samodzielność bez przejmowania kontroli.','Nadal aktywnie buduję wspólne wspomnienia.','Akceptuję, że mogą mieć inne wartości i pomysły na życie.','Nasza bliskość pozostaje możliwa mimo różnic i zmian.'],
  10:['Mam z obiema córkami bliską, bezpieczną i pełną zaufania relację.','Potrafię być obecna, rozmawiać o trudnych sprawach, stawiać granice i naprawiać konflikty.','Córki mają przestrzeń, by być sobą, rozwijać samodzielność i wracać do mnie po wsparcie.','Wspólny czas nadal ma dla nas wartość, choć każda z nas ma własne życie.']},
 g2:{1:['Robię pomiar bazowy (waga, tkanka tłuszczowa, masa mięśniowa).','Waga 85 kg: redukcja masy i ochrona mięśni.','Poduszka finansowa 33 000 zł.','Kontroluję wydatki; mój miesięczny budżet 2 000 zł.','Wakacje w rocznym budżecie 24 000 zł.','Wprowadzam swoje zasady: alkohol, zakupy, jedzenie.'],
  2:['Tkanka tłuszczowa 30%: redukcja tłuszczu i rozwój mięśni.','Poduszka finansowa 50 000 zł.','Mój miesięczny budżet 2 250 zł.','Spłacam zadłużenie (samochód).','Stabilność i konsekwencja w nawykach.'],
  3:['Tkanka tłuszczowa 27%: lepsza kompozycja ciała.','Oszczędności 85 470 zł; oszczędzam i inwestuję.','Mój miesięczny budżet 2 500 zł.','Wakacje w rocznym budżecie 30 000 zł.'],
  5:['Tkanka tłuszczowa 25%: silna, sprawna sylwetka.','Oszczędności 297 543 zł: większa swoboda wyboru.','Mój miesięczny budżet 3 000 zł.','Wakacje w rocznym budżecie 40 000 zł.'],
  7:['Tkanka tłuszczowa poniżej 25%, masa mięśniowa 30%.','Oszczędności 518 577 zł: niezależność finansowa.','Wakacje w rocznym budżecie 50 000 zł.'],
  10:['Zdrowy poziom tkanki tłuszczowej; masa mięśniowa utrzymana lub więcej.','Oszczędności 844 459 zł: bezpieczeństwo i opcje na przyszłość.','Sprawność na kolejne dekady.']},
 g3:{1:['Ustalam rytm twórczy (2 godz. tygodniowo).','Wybieram główny projekt i zaczynam go realizować.','Widoczny postęp muzyczny (pianino).','Dodaję nowy pomysł do banku pomysłów.'],
  2:['Wypuszczam pierwszy projekt (np. prototyp, stronę, usługę lub publikację).','Zbieram opinie i wnioski.','Kontynuuję rozwój muzyczny.','Dodaję nowy pomysł.'],
  3:['Wypuszczam kolejny projekt.','Rozwijam umiejętności i testuję nowe pomysły.','Nagrywam pierwsze utwory lub kończę kurs.','Dodaję nowy pomysł.'],
  5:['Mam kilka ukończonych projektów.','Lepiej wiem, które pomysły dają mi najwięcej satysfakcji i mają potencjał rynkowy.','Muzyka jest regularną częścią mojego życia (nagrania, występy, kursy).'],
  7:['Potrafię regularnie zamieniać pomysły w realne rezultaty.','Mam na koncie zarówno sukcesy, jak i projekty, które się nie powiodły (i wyciągam z nich wnioski).','Muzyka daje mi radość i jest ważną częścią mojego życia.'],
  10:['Mam na koncie kilka ukończonych produktów, projektów lub publikacji.','Regularnie tworzę i eksperymentuję.','Muzyka: własne nagrania, być może publikacja, koncerty lub współpraca.','Dodaję nowe pomysły, które chcę realizować po 50.']},
 g4:{1:['Tworzę listę 30 rzeczy, których chcę spróbować.','Realizuję minimum 12 nowych doświadczeń (ok. 1 miesięcznie).','Planuję 1 większą podróż i kilka mniejszych.','Zaczynam nowe hobby lub kurs.'],
  2:['Utrzymuję minimum 12 nowych doświadczeń rocznie.','Podejmuję jedno doświadczenie, które trochę mnie onieśmiela.','Organizuję przynajmniej jedną samodzielną wyprawę lub wyjście.','Rozwijam nową umiejętność.'],
  3:['Mam za sobą ok. 36 nowych doświadczeń.','Swobodniej podejmuję inicjatywę.','Regularnie uczestniczę w kulturze (koncerty, wystawy, teatr).','Miejsca bliskie i dalekie są częścią mojego życia.'],
  5:['Mam za sobą ok. 60 nowych doświadczeń.','Kilka wypróbowanych hobby i ukończonych kursów.','Nowe znajomości i inspirujące środowiska.','Niezapomniane wspomnienia z rodziną i samodzielnych podróży.'],
  7:['Mam za sobą ok. 84 nowych doświadczeń.','Śmielej podejmuję wyzwania i próbuję nowych rzeczy.','Regularnie podróżuję, uczę się i uczestniczę w wydarzeniach kulturalnych.','Lepiej rozumiem siebie i wiem, co daje mi największą radość.'],
  10:['Mam za sobą ok. 120 nowych doświadczeń.','Podróże, kultura, nauka i nowi ludzie są naturalną częścią mojego życia.','Nadal regularnie próbuję nowych rzeczy.','Tworzę życie pełne ciekawości, które naprawdę mnie cieszy.']},
 g5:{1:['Wprowadzam 15-minutowe rozmowy z mężem.','Tworzę listę tematów od łatwych do trudniejszych.','Rozpoczynam cotygodniową refleksję z AI.','Wdrażam system kontaktów z ważnymi osobami.','Zaczynam rozpoznawać własne wzorce w relacjach.'],

const DN=['pon','wt','śr','czw','pt','sob','nd'];

const MG=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pd(s){const a=String(s).slice(0,10).split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ds(d);}
function addYears(s,n){const d=pd(s);d.setFullYear(d.getFullYear()+n);return ds(d);}
function addMonths1(s,n){const d=pd(s);return ds(new Date(d.getFullYear(),d.getMonth()+n,1));}
function wd(s){return (pd(s).getDay()+6)%7;}
function weekStart(s){return addDays(s,-wd(s));}
function monthEnd(s){const d=pd(s);return ds(new Date(d.getFullYear(),d.getMonth()+1,0));}
function TODAY(){return ds(new Date());}
function fmtDay(s){const d=pd(s);return DNL[wd(s)]+', '+d.getDate()+' '+MG[d.getMonth()];}
function fmtShort(s){const d=pd(s);return d.getDate()+' '+MG[d.getMonth()].slice(0,3);}
function daysBetween(a,b){return Math.round((pd(b)-pd(a))/864e5);}
function fmtNum(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function fmtV(v){if(v==null||v==='')return '';v=Number(v);return Math.abs(v)>=1000?fmtNum(v):String(Math.round(v*10)/10).replace('.',',');}
function pct(x){return Math.round((x||0)*100)+'%';}
function SET(){return get('set','main')||{startDate:'2026-10-01',startAge:40};}
function yearStart(y){return addYears(SET().startDate,y-1);}
function yearEnd(y){return addDays(addYears(SET().startDate,y),-1);}
function yearOf(d){const s=SET().startDate;if(d<s)return 1;let y=1;while(y<10&&addYears(s,y)<=d)y++;return y;}
function curYear(){return yearOf(TODAY());}
function pace(y){const t=TODAY(),a=yearStart(y),b=yearEnd(y);if(t<a)return 0;if(t>b)return 1;return (daysBetween(a,t)+1)/(daysBetween(a,b)+1);}
function yrs(x,y){return (x.fromYear||1)<=y&&y<=(x.toYear||10);}

const EVERY={week:'Co tydzień',month:'Co miesiąc',month2:'Co 2 miesiące',quarter:'Co kwartał',year:'Co rok'};
const WIN={week:'w tym tygodniu',month:'w tym miesiącu',month2:'w tych 2 miesiącach',quarter:'w tym kwartale',year:'w tym roku planu'};
function firstNext(x,from){const d=pd(from);
 if(x.every==='week')return (x.wday==null||x.wday<0)?weekStart(from):addDays(from,((x.wday)-wd(from)+7)%7);
 if(x.every==='month'||x.every==='month2')return ds(new Date(d.getFullYear(),d.getMonth(),1));
 if(x.every==='quarter')return ds(new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1));
 if(x.every==='year')return yearStart(yearOf(from));
 return from;}
function advance(x,s){if(x.every==='week')return addDays(s,7);if(x.every==='month')return addMonths1(s,1);if(x.every==='month2')return addMonths1(s,2);if(x.every==='quarter')return addMonths1(s,3);if(x.every==='year')return addYears(s,1);return addDays(s,1);}
function cadence(x){if(x.kind!=='repeat')return x.date?fmtShort(x.date):'bez daty';if(x.every==='week'&&x.wday>=0)return 'co tydzień, '+DN[x.wday];return EVERY[x.every].toLowerCase();}
function flexible(x){return x.kind==='repeat'&&!(x.every==='week'&&x.wday>=0);}
function winEnd(x){if(!x.next)return '';if(x.every==='year')return yearEnd(yearOf(x.next));return addDays(advance(x,x.next),-1);}
function inToday(x,d){if(doneToday(x))return true;if(!repeatDue(x,d))return false;if(!flexible(x))return true;return x.planned===d||daysBetween(d,winEnd(x))<=2;}
function doneToday(x){return x.kind==='repeat'&&x.lastDone===TODAY();}
function repeatDue(x,d){return x.kind==='repeat'&&!x.paused&&!frozen(d)&&yrs(x,yearOf(d))&&x.next&&x.next<=d;}
function completions(){return all('task').reduce((s,x)=>s+(x.kind==='repeat'?(x.hist||[]).length:(x.done?1:0)),0);}
function listOf(x){return x.listId?get('list',x.listId):null;}
function itemOf(L,id){return L?(L.items||[]).find(i=>i.id===id):null;}

function completeTask(id){const x=get('task',id),t=TODAY(),L=listOf(x),it=itemOf(L,x.pick);
 if(L&&it){it.done=true;it.doneAt=t;put('list',L);}
 if(x.kind==='repeat'){x.hist=(x.hist||[]).concat([{d:t,item:it?it.text:'',itemId:it?it.id:''}]);x.prevNext=x.next;x.prevSubs=clone(x.subtasks||[]);x.prevPick=x.pick||'';let n=x.next||t;do{n=advance(x,n);}while(n<=t);x.next=n;x.lastDone=t;(x.subtasks||[]).forEach(s=>s.done=false);x.pick='';}
 else{x.done=true;x.doneAt=t;if(x.date&&x.date<t)x.date=t;}
 put('task',x);
 if(it)toast('Zrobione: '+it.text);}
function undoTask(id){const x=get('task',id);
 if(x.kind==='repeat'){if(x.lastDone!==TODAY())return;const last=(x.hist||[]).pop();x.next=x.prevNext;x.subtasks=x.prevSubs||x.subtasks;x.pick=x.prevPick||'';x.lastDone='';
  if(last&&last.itemId){const L=listOf(x),it=itemOf(L,last.itemId);if(it){it.done=false;it.doneAt='';put('list',L);}}}
 else{x.done=false;x.doneAt='';const L=listOf(x),it=itemOf(L,x.pick);if(it){it.done=false;it.doneAt='';put('list',L);}}
 put('task',x);}

// ================= MODEL =================
function GN(g){const r=get('goal',g);return r?r.name:G[g].name;}
function msOf(g,y){return all('ms').filter(m=>m.goalId===g&&(y==null||m.year===y)).sort((a,b)=>(a.order||0)-(b.order||0)||(a.updatedAt-b.updatedAt));}
function habits(g,y){return all('habit').filter(x=>(!g||x.goalId===g)&&(y==null||yrs(x,y))).sort((a,b)=>a.id<b.id?-1:1);}
function tasksOf(g,y){return all('task').filter(x=>x.goalId===g&&yrs(x,y));}
function applies(hb,d){return hb.freq==='days'&&activeH(hb)&&!frozen(d)&&yrs(hb,yearOf(d))&&(!hb.days||!hb.days.length||hb.days.includes(wd(d)))&&(hb.createdOn||'')<=d;}
function logged(hid,d){return !!get('log','l-'+hid+'-'+d);}
function nLogs(hid,a,b){return all('log').filter(l=>l.habitId===hid&&l.date>=a&&l.date<=b).length;}
function period(hb,d){if(hb.freq==='days')return [d,d];const s=pStart(hb,d);return [s,pEnd(hb,s)];}
function prog(hb,d){const p=period(hb,d);return {done:nLogs(hb.id,p[0],p[1]),need:hb.freq==='days'?1:(Number(hb.target)||1)};}
function habitRate(hb){if(!activeH(hb))return null;const t=TODAY();let from=addDays(t,-27);const c=hb.createdOn||SET().startDate;if(c>from)from=c;const n=daysBetween(from,t)+1;if(n<7)return null;
 if(hb.freq==='days'){let need=0,done=0;for(let i=0;i<n;i++){const d=addDays(from,i);if(!applies(hb,d))continue;if(d===t&&!logged(hb.id,d))continue;need++;if(logged(hb.id,d))done++;}return need?done/need:null;}
 return Math.min(1,nLogs(hb.id,from,t)/((Number(hb.target)||1)*n/(PDAYS[hb.freq]||7)));}
const PDAYS={week:7,month:30,month2:61,quarter:91,year:365};
const PWORD={week:'w tygodniu',month:'w miesiącu',month2:'na 2 miesiące',quarter:'na kwartał',year:'w roku'};
function habDesc(hb){if(hb.freq==='days')return hb.days&&hb.days.length&&hb.days.length<7?hb.days.map(i=>DN[i]).join(', '):'codziennie';return hb.target+'× '+(PWORD[hb.freq]||'');}
function yearsDesc(x){const a=x.fromYear||1,b=x.toYear||10;return a===1&&b===10?'':(a===b?'Rok '+a:'lata '+a+'–'+b);}
function nums(g){return all('num').filter(n=>n.goalId===g).sort((a,b)=>(a.order||0)-(b.order||0));}
function lists(g){return all('list').filter(l=>!g||l.goalId===g).sort((a,b)=>a.name<b.name?-1:1);}
function nLast(n){const hs=(n.hist||[]).slice().sort((a,b)=>a[0]<b[0]?-1:1);return hs.length?hs[hs.length-1][1]:null;}
function nTarget(n,y){const ks=Object.keys(n.targets||{}).map(Number).filter(k=>n.targets[k]!==''&&n.targets[k]!=null).sort((a,b)=>a-b);if(!ks.length)return null;const k=ks.find(v=>v>=y);const yy=k!=null?k:ks[ks.length-1];return {y:yy,v:Number(n.targets[yy])};}
function nProg(n,y){const tg=nTarget(n,y||curYear()),hs=(n.hist||[]).slice().sort((a,b)=>a[0]<b[0]?-1:1);if(!tg||!hs.length)return null;const st=hs[0][1],v=hs[hs.length-1][1];if(tg.v===st)return 1;return Math.max(0,Math.min(1,(v-st)/(tg.v-st)));}

function health(g){const y=curYear(),ms=msOf(g,y),dn=ms.filter(m=>m.done).length,msP=ms.length?dn/ms.length:null,p=pace(y);
 const rs=habits(g,y).map(habitRate).filter(x=>x!=null),hP=rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null,gap=msP==null?0:msP-p;
 let st;
 if(hP==null&&p<0.15&&(msP||0)<0.2)st='start';
 else if((hP!=null&&hP<0.5)||gap<-0.25)st='focus';
 else if((hP==null||hP>=0.8)&&gap>=-0.05)st='great';
 else st='ok';
 const score=(hP!=null?hP:0.7)*0.5+(0.5+gap)*0.5;
 let why='';
 if(st==='focus')why=(hP!=null&&hP<0.5)?'Nawyki tylko '+pct(hP)+' w ostatnich 4 tygodniach.':dn+' z '+ms.length+' punktów kierunku, a minęło już '+pct(p)+' roku.';
 else if(st==='great')why=hP!=null?'Nawyki '+pct(hP)+(gap>0.1?', kierunek przed planem':'')+'.':dn+' z '+ms.length+' punktów, przed planem.';
 else if(st==='ok')why=dn+' z '+ms.length+' punktów kierunku'+(hP!=null?' · nawyki '+pct(hP):'')+'.';
 else why='Za wcześnie na ocenę.';
 return {g,st,dn,tot:ms.length,msP,p,hP,score,why};}

function dayItems(d){const t=TODAY(),isT=d===t,r=[];if(frozen(d))return r;
 all('task').filter(x=>x.kind==='once'&&x.date&&x.date<d&&!x.done&&isT).sort((a,b)=>a.date<b.date?-1:1).forEach(x=>r.push({k:'t',x,done:false,late:true}));

 habits(null,yearOf(d)).filter(hb=>activeH(hb)&&hb.freq!=='days').forEach(hb=>{const p=prog(hb,d),on=logged(hb.id,d);if(on||p.done<p.need)r.push({k:'h',hb,done:on,per:p});});

 if(isT)all('task').filter(x=>inToday(x,d)).sort((a,b)=>(a.next||'')<(b.next||'')?-1:1).forEach(x=>r.push({k:'t',x,done:doneToday(x)}));
 all('task').filter(x=>x.kind==='once'&&x.date===d).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(x=>r.push({k:'t',x,done:x.done}));
 return r;}
function dayFull(d){const it=dayItems(d).filter(i=>!i.late&&!(i.k==='t'&&i.x.kind==='repeat')&&!i.per);return it.length>0&&it.every(i=>i.done);}

function fullStreak(){let d=TODAY(),n=0;if(!dayFull(d))d=addDays(d,-1);for(let i=0;i<400;i++){if(d<SET().startDate)break;if(dayFull(d)){n++;d=addDays(d,-1);}else break;}return n;}
function weekStreakMax(){let best=0;habits().filter(b=>b.freq==='week').forEach(b=>{let ws=weekStart(TODAY()),n=0;const cur=prog(b,ws);if(cur.done>=cur.need)n++;ws=addDays(ws,-7);for(let i=0;i<260;i++){if(addDays(ws,6)<(b.createdOn||''))break;const p=prog(b,ws);if(p.done>=p.need){n++;ws=addDays(ws,-7);}else break;}best=Math.max(best,n);});return best;}
function all5(){const ws=weekStart(TODAY()),we=addDays(ws,6);return GIDS.every(g=>all('log').some(l=>l.date>=ws&&l.date<=we&&get('habit',l.habitId)&&get('habit',l.habitId).goalId===g)||all('task').some(t=>t.goalId===g&&((t.done&&t.doneAt>=ws&&t.doneAt<=we)||(t.hist||[]).some(z=>z.d>=ws&&z.d<=we)))||all('ms').some(m=>m.goalId===g&&m.done&&m.doneAt>=ws));}
function numHit(){return all('num').some(n=>{const tg=nTarget(n,curYear()),v=nLast(n),hs=n.hist||[];if(!tg||v==null||hs.length<2)return false;const st=hs.slice().sort((a,b)=>a[0]<b[0]?-1:1)[0][1];return tg.v<st?v<=tg.v:v>=tg.v;});}

// ================= SYNCHRONIZACJA =================
let syncTimer=null,syncing=false,syncMsg='nie skonfigurowano';
function setSync(st,msg){syncMsg=msg||{off:'nie skonfigurowano',busy:'synchronizuję…',ok:'zsynchronizowano',err:'błąd'}[st];const d=document.getElementById('syncDot');d.className='sdot '+st;d.title=syncMsg;}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(sync,2500);}
async function sync(manual){const L=LOC();if(!L.url){setSync('off');if(manual)toast('Wpisz URL Apps Script');return;}
 if(syncing){scheduleSync();return;}syncing=true;setSync('busy');const started=Date.now(),recs=[];
 COLS.forEach(c=>Object.values(DB.data[c]).forEach(r=>{if(!DB.lastSync||(r.updatedAt||0)>DB.lastSync-60000)recs.push({col:c,id:r.id,updatedAt:r.updatedAt||0,deleted:r.deleted?1:0,json:JSON.stringify(r)});}));
 try{const res=await fetch(L.url,{method:'POST',body:JSON.stringify({key:L.key||'',records:recs})}),j=await res.json();if(!j.ok)throw new Error(j.error||'błąd serwera');
  let ch=false;(j.records||[]).forEach(x=>{if(!DB.data[x.col])return;const cur=DB.data[x.col][x.id];if(!cur||(cur.updatedAt||0)<Number(x.updatedAt)){try{DB.data[x.col][x.id]=JSON.parse(x.json);ch=true;}catch(e){}}});
  DB.lastSync=started;persist();syncGoals();setSync('ok');if(manual)toast('Zsynchronizowano');if(ch&&!EDIT)render();
 }catch(e){setSync('err','błąd: '+e.message);if(manual)toast('Błąd synchronizacji: '+e.message);}
 syncing=false;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(UI.view==='today'&&UI.date<TODAY())UI.date=TODAY();render();sync();}});


// ================= CYKL ŻYCIA NAWYKÓW, NAGRODY, URLOP, TYDZIEŃ =================
const HST={on:['Rytuał','#E8F0F5','#557489'],build:['Buduję','#F2E9F0','#77566F'],have:['🏅 Utrwalony','#EDF2EA','#5F7A5A'],later:['Później','#F1EDEF','#8A8288']};
function hState(hb){return hb.state||'later';}
function activeH(hb){return hState(hb)==='build';}
function perWeek(hb){if(hb.freq==='days')return (hb.days&&hb.days.length)?hb.days.length:7;return (Number(hb.target)||1)*7/(PDAYS[hb.freq]||7);}
function hType(hb){if(['month2','quarter','year'].includes(hb.freq))return 'ritual';return perWeek(hb)>=4?'daily':'rare';}
const TYPEN={daily:'częste',rare:'rzadsze (raz w tygodniu lub rzadziej)'};
function vacs(){return SET().vac||[];}
function frozen(d){return vacs().some(v=>d>=v.from&&d<=v.to);}
function frozenRange(a,b){return vacs().some(v=>v.from<=b&&v.to>=a);}
function curVac(){const t=TODAY();return vacs().find(v=>t>=v.from&&t<=v.to);}
const MSPAN={month:1,month2:2,quarter:3};
function pStart(hb,d){if(hb.freq==='days'||hb.freq==='week')return weekStart(d);if(hb.freq==='year')return yearStart(yearOf(d));const t=pd(d),k=MSPAN[hb.freq]||1;return ds(new Date(t.getFullYear(),Math.floor(t.getMonth()/k)*k,1));}
function pEnd(hb,s){if(hb.freq==='days'||hb.freq==='week')return addDays(s,6);if(hb.freq==='year')return addDays(addYears(s,1),-1);return addDays(addMonths1(s,MSPAN[hb.freq]||1),-1);}
function pPrev(hb,s){if(hb.freq==='days'||hb.freq==='week')return addDays(s,-7);if(hb.freq==='year')return addYears(s,-1);return addMonths1(s,-(MSPAN[hb.freq]||1));}
function pName(hb){return {month:'mies.',month2:'okr. 2-mies.',quarter:'kw.',year:'lat'}[hb.freq]||'tyg.';}
function pOk(hb,s){const e=pEnd(hb,s);if(hb.freq==='days'){let need=0;for(let i=0;i<7;i++){const d=addDays(s,i);if(frozen(d))continue;if(hb.days&&hb.days.length&&!hb.days.includes(wd(d)))continue;need++;if(!logged(hb.id,d))return false;}return need>0;}return nLogs(hb.id,s,e)>=(Number(hb.target)||1);}
function buildStreak(hb){const t=TODAY(),cur=pStart(hb,t),start=pStart(hb,hb.stateSince||t);let s=cur,n=0;
 for(let i=0;i<200&&s>=start;i++,s=pPrev(hb,s)){if(frozenRange(s,pEnd(hb,s)))continue;if(pOk(hb,s))n++;else if(s===cur)continue;else break;}return n;}
function idleRun(hb){const t=TODAY(),start=pStart(hb,hb.stateSince||t);let s=pPrev(hb,pStart(hb,t)),n=0;
 for(let i=0;i<200&&s>=start;i++,s=pPrev(hb,s)){if(frozenRange(s,pEnd(hb,s)))continue;if(nLogs(hb.id,s,pEnd(hb,s))===0)n++;else break;}return n;}
// --- reguły utrwalania: zawsze min. 90%; częste przez 4 tygodnie, rzadsze w dłuższym oknie (ok. 12 powtórzeń)
function winLen(hb){if(hType(hb)==='daily')return 4;if(hb.freq==='month')return Math.max(3,Math.min(6,Math.ceil(12/(Number(hb.target)||1))));return Math.max(4,Math.ceil(12/Math.max(1,perWeek(hb))));}
function pNext(hb,s){return pStart(hb,addDays(pEnd(hb,s),1));}
function perND(hb,s){if(hb.freq==='days'){let n=0,d=0;for(let i=0;i<7;i++){const x=addDays(s,i);if(frozen(x))continue;if(hb.days&&hb.days.length&&!hb.days.includes(wd(x)))continue;n++;if(logged(hb.id,x))d++;}return [n,d];}const n=Number(hb.target)||1;return [n,Math.min(n,nLogs(hb.id,s,pEnd(hb,s)))];}
function perList(hb){const t=TODAY(),cur=pStart(hb,t),start=pStart(hb,hb.stateSince||t),r=[];for(let s=start,i=0;s<=cur&&i<600;s=pNext(hb,s),i++){if(frozenRange(s,pEnd(hb,s)))continue;if(s===cur){const z=perND(hb,s);if(z[1]<z[0])break;}r.push(s);}return r;}
function genProg(hb){const W=winLen(hb),ps=perList(hb),last=ps.slice(-W);let n=0,d=0;last.forEach(s=>{const z=perND(hb,s);n+=z[0];d+=z[1];});const rate=n?d/n:0;return {cnt:ps.length,W,rate,ok:ps.length>=W&&n>0&&rate>=0.9};}
function freqProg(hb){const g=genProg(hb);return {weeks:g.cnt,rate:g.rate,ok:g.ok};}
function earnedNow(hb){const ty=hType(hb);return (ty==='daily'||ty==='rare')&&genProg(hb).ok;}
function progFrac(hb){const ty=hType(hb);if(ty==='ritual')return 0;const g=genProg(hb);return Math.min(1,g.cnt/g.W);}
function unitN(hb){return hb.freq==='month'?'miesiąc':'tydzień';}
function progText(hb){const ty=hType(hb);if(ty==='ritual')return '';const g=genProg(hb);return g.cnt?unitN(hb)+' '+Math.min(g.W,g.cnt)+'/'+g.W+' · '+pct(g.rate)+' (min. 90%)':'pierwszy '+unitN(hb)+' · cel: '+g.W+' '+(hb.freq==='month'?'mies.':'tyg.')+' na min. 90%';}

function pickList(){const f=freeSlots();let o='';
 ['daily','rare'].forEach(ty=>{const cs=candidates(ty),bl=curH().filter(b=>hState(b)==='build'&&hType(b)===ty);if(!cs.length&&!bl.length)return;
  if(UI.hsetup&&bl.length)o+=sech('Wybrane '+(ty==='daily'?'częste':'rzadsze')+' · '+bl.length+'/2','')+'<div class="card list">'+bl.map(b=>'<div class="row"><div class="rt"><div>'+h(b.name)+'</div><div class="meta"><span class="dot" style="background:'+G[b.goalId].c+'"></span>'+h(GN(b.goalId))+' · '+habDesc(b)+'</div></div><button class="btn sm ghost" data-act="sUndo" data-id="'+b.id+'">Cofnij</button></div>').join('')+'</div>';
  if(!cs.length)return;
  o+=sech('Wybierz '+(ty==='daily'?'częste':'rzadsze')+' · wolne: '+f[ty],ty==='daily'?'Nawyki robione 4 razy w tygodniu lub częściej.':'Nawyki robione rzadziej niż 4 razy w tygodniu.')+'<div class="card list">';
  cs.forEach(b=>{const c=G[b.goalId];o+='<div class="row"><div class="rt" data-act="habEdit" data-id="'+b.id+'"><div>'+h(b.name)+'</div><div class="meta"><span class="dot" style="background:'+c.c+'"></span>'+h(GN(b.goalId))+' · '+habDesc(b)+'</div></div><button class="btn sm'+(f[ty]?'':' ghost dis')+'" data-act="hBuild" data-id="'+b.id+'">Buduję</button></div>';});
  o+='</div>';});
 const rts=curH().filter(b=>hType(b)==='ritual');if(rts.length)o+=sech('Rytuały (opcjonalnie)','Bez limitu i bez naklejki. Włącz te, które chcesz mieć w kalendarzu.')+'<div class="card list">'+rts.map(ritualRow).join('')+'</div>';
 return o+'<div class="btnrow"><button class="btn" data-act="pickDone">Gotowe</button><button class="btn ghost" data-act="habNew" data-g="g1">'+ic('plus',16)+' Nowy nawyk</button></div>';}
function setupList(){const step=UI.sstep||1;
 if(step===1){let o=sech('Krok 1 z 2: co już masz?','Zaznacz nawyki, które już są w Twojej rutynie. Dostają naklejkę 🏅 od razu.');
  GIDS.forEach(g=>{const hs=curH().filter(b=>b.goalId===g&&hType(b)!=='ritual');if(!hs.length)return;o+='<div class="card list"><div class="sgh">'+gb(g,24)+' <b>'+h(GN(g))+'</b></div>';
   hs.forEach(b=>{const on=hState(b)==='have';o+='<div class="row" data-act="sHave" data-id="'+b.id+'">'+cb(on,G[g].c,'sHave','data-id="'+b.id+'"')+'<div class="rt"><div>'+h(b.name)+'</div><div class="meta">'+habDesc(b)+'</div></div></div>';});o+='</div>';});
  return o+'<div class="btnrow"><button class="btn" data-act="sNext">Dalej</button><button class="btn ghost" data-act="habNew" data-g="g1">'+ic('plus',16)+' Dodaj nawyk</button></div>';}
 if(step===3){const rs=all('task').filter(x=>x.kind==='repeat'&&yrs(x,curYear())),on=rs.filter(x=>!x.paused).length;let o=sech('Krok 3 z 3: zadania cykliczne','Domyślnie wszystkie są wstrzymane. Włącz te, które chcesz mieć w rytmie. Zacznij od 2–3. Resztę włączysz później w planie celu.')+'<div class="meta pad">Włączone: <b>'+on+'</b></div>';
  GIDS.forEach(g=>{const l=rs.filter(x=>x.goalId===g);if(!l.length)return;o+='<div class="card list"><div class="sgh">'+gb(g,24)+' <b>'+h(GN(g))+'</b></div>'+l.map(x=>'<div class="row" data-act="sTask" data-id="'+x.id+'">'+cb(!x.paused,G[g].c,'sTask','data-id="'+x.id+'"')+'<div class="rt"><div>'+h(x.title)+'</div><div class="meta">'+cadence(x)+((x.subtasks||[]).length?' · '+x.subtasks.length+' kroków':'')+'</div></div></div>').join('')+'</div>';});
  return o+'<div class="btnrow"><button class="btn" data-act="setupDone">Gotowe</button></div>';}
 return sech('Krok 2 z 2: co budujesz?','Wybierz 2 nawyki robione 4 razy w tygodniu lub częściej i, jeśli są, 2 rzadsze. Naklejka, gdy robisz nawyk na min. 90%: częste przez 4 tygodnie, rzadsze dłużej (ok. 12 powtórzeń). Reszta czeka na swoją kolej.')+pickList().replace('data-act="pickDone">Gotowe','data-act="setupDone">Gotowe');}

// ---- urlop ----
function sheetVac(){const v=vacs().slice().sort((a,b)=>a.from<b.from?1:-1);
 let o='<h3>🌴 Tryb urlopowy</h3><div class="hint">Na czas urlopu aplikacja się zamraża: nawyki i zadania znikają z listy Dziś, a te tygodnie nie liczą się do naklejek ani ich utraty. Zadania cykliczne, których okres minął, po powrocie zaczynają się od nowa.</div><label class="fl">Od</label><input type="date" id="vFrom" class="inp" value="'+TODAY()+'"><label class="fl">Do</label><input type="date" id="vTo" class="inp" value="'+addDays(TODAY(),7)+'">';
 if(v.length)o+='<label class="fl">Urlopy</label><div class="list">'+v.map(z=>'<div class="row sub"><div class="rt">'+fmtShort(z.from)+' – '+fmtShort(z.to)+' '+pd(z.to).getFullYear()+'</div><button class="mini" data-act="vacDel" data-from="'+z.from+'" aria-label="Usuń">'+ic('x',15)+'</button></div>').join('')+'</div>';
 o+='<div class="btnrow"><button class="btn" style="background:#7E9FB5" data-act="vacSave">Włącz urlop</button><button class="btn ghost" data-act="closeSheet">Anuluj</button></div>';openSheet(o);}

function toggleWeek(id){const x=get('task',id),ws=thisWeek();if(x.week===ws){x.week='';}else{if(weekPicked().length>=3){toast('Masz już 3 zadania na ten tydzień. Najpierw odznacz jedno.');return false;}x.week=ws;}put('task',x);return true;}
Object.assign(A,{
 openSetup:()=>{UI.hsetup=true;UI.sstep=1;UI.hsheet=true;sheetHabFlow();},
 sHave:d=>{const b=get('habit',d.id);setHState(b,hState(b)==='have'?'later':'have',true);put('habit',b);rr();},
 sUndo:d=>{const b=get('habit',d.id);setHState(b,'later',true);put('habit',b);rr();},
 sNext3:()=>{UI.sstep=3;window.scrollTo(0,0);render(true);},
 sTask:d=>{const x=get('task',d.id);x.paused=!x.paused;if(!x.paused&&(!x.next||winEnd(x)<TODAY()))x.next=firstNext(x,TODAY());put('task',x);render(true);},
 sNext:()=>{UI.sstep=2;document.getElementById('sheetCard').scrollTop=0;rr();},
 setupDone:()=>{const s=get('set','main');s.setupDone=true;s.lastReview=TODAY();put('set',s);UI.hsetup=false;UI.sstep=1;UI.hsheet=false;closeSheet();toast('Gotowe. Powodzenia!');},
 pickHabits:()=>{UI.hsetup=false;UI.hsheet=true;sheetHabFlow();},
 pickDone:()=>{UI.hsheet=false;closeSheet();},
 hBuild:d=>{const b=get('habit',d.id);if(setHState(b,'build')){put('habit',b);toast('Budujesz: '+b.name);}rr();},
 hLater:d=>{const b=get('habit',d.id);if(!confirm('Odznaczyć „'+b.name+'”? Naklejka zniknie, a nawyk wróci do kolejki.'))return;setHState(b,'later',true);put('habit',b);render(true);},
 rewardPaid:d=>{const r=get('reward',d.id);r.paid=!r.paid;put('reward',r);render(true);if(r.paid)toast('Ciesz się nagrodą! 💰');},
 weekTag:d=>{if(toggleWeek(d.id)){render(true);toast(get('task',d.id).week?'Na ten tydzień ★':'Usunięto z tygodnia');}},
 weekTagS:d=>{toggleWeek(d.id);sheetWeekPlan();},
 weekPlan:()=>sheetWeekPlan(),
 weekToday:d=>{const x=get('task',d.id);if(x.kind==='once'){x.date=TODAY();x.fromYear=x.toYear=curYear();}else x.planned=TODAY();put('task',x);render(true);},
 tWeek:d=>{readTask();const ws=thisWeek();if(d.v===ws&&EDIT.t.week!==ws&&weekPicked().filter(x=>x.id!==EDIT.t.id).length>=3)return toast('Masz już 3 zadania na ten tydzień.');EDIT.t.week=d.v;sheetTask();},
 bState:d=>{readHab();const b=EDIT.b;if(d.v==='build'&&hState(b)!=='build'&&nBuild(hType(b),b.id)>=2)return toast('Masz już 2 nawyki '+(hType(b)==='daily'?'częste':'rzadsze')+' w budowie.');b._st=d.v;sheetHab();},
 reviewOpen:()=>{EDIT={rv:{}};sheetReview();},
 rvSet:d=>{EDIT.rv[d.id]=d.v==='1';sheetReview();},
 rvSave:()=>{const rv=EDIT.rv||{};let n=0;Object.keys(rv).forEach(id=>{if(rv[id]){const b=get('habit',id);setHState(b,'later',true);put('habit',b);n++;}});const s=get('set','main');s.lastReview=TODAY();put('set',s);closeSheet();toast(n?'Odznaczone: '+n+'. Wrócą do kolejki.':'Super, wszystkie wciąż w rutynie 🏅');},
 rOn:d=>{const b=get('habit',d.id);b.state='on';b.stateSince=TODAY();put('habit',b);rr();toast('Rytuał włączony');},
 rOff:d=>{const b=get('habit',d.id);b.state='later';put('habit',b);rr();},
 vacOpen:()=>sheetVac(),
 vacSave:()=>{const f=val('vFrom'),t=val('vTo');if(!f||!t||t<f)return toast('Sprawdź daty');const s=get('set','main');s.vac=(s.vac||[]).concat([{from:f,to:t}]);put('set',s);closeSheet();toast('Miłego urlopu 🌴');},
 vacEnd:()=>{const s=get('set','main'),t=TODAY();s.vac=(s.vac||[]).map(v=>{if(t>=v.from&&t<=v.to){v.to=addDays(t,-1);}return v;}).filter(v=>v.to>=v.from);put('set',s);processVac();render(true);toast('Witaj z powrotem!');},
 vacDel:d=>{const s=get('set','main');s.vac=(s.vac||[]).filter(v=>v.from!==d.from);put('set',s);sheetVac();}
});

seed();syncGoals();processVac();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
setSync(LOC().url?'ok':'off');render(true);sync();

</script>
